org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# App version - increase for every release you install on the robot
appVersionCode=1
appVersionName=1.0.0

# Signing for release and debug APKs (demo key for the event; use your own keystore for production).
# Debug and release share the key, so a newer build can be installed over an older one with "adb install -r".
releaseStoreFile=../keystore/wayfinder.jks
releaseStorePassword=wayfinder2026
releaseKeyAlias=wayfinder
releaseKeyPassword=wayfinder2026
