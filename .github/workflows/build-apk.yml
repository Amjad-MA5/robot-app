# Builds the APK on GitHub's servers (free) and publishes it as a download.
# Trigger: push to main, or "Actions" -> "Build APK" -> "Run workflow".
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Android SDK is preinstalled on GitHub's runners ($ANDROID_HOME).
      # android-actions/setup-android@v3 currently fails there ("Failed to find package 'tools'"),
      # so only accept the licenses - Gradle downloads missing packages itself.
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk smart-receptionist.apk

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-receptionist-apk
          path: android/smart-receptionist.apk

      # Fixed download link (also for the browser on the robot):
      # https://github.com/<user>/<repo>/releases/download/latest/smart-receptionist.apk
      - name: Update the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest smart-receptionist.apk --title "Smart Receptionist (latest build)" --notes "Built automatically from ${GITHUB_SHA::7}"
