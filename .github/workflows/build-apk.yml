# Baut die APK auf GitHub-Servern (kostenlos) und stellt sie als Download bereit.
# Auslösen: Code hochladen (push) oder unter "Actions" → "Build APK" → "Run workflow".
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Das Android SDK ist auf den GitHub-Runnern schon vorinstalliert ($ANDROID_HOME).
      # android-actions/setup-android@v3 bricht dort derzeit ab ("Failed to find package 'tools'"),
      # deshalb nur die Lizenzen bestätigen – fehlende Pakete lädt Gradle dann selbst nach.
      - name: Android SDK vorbereiten
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Unit-Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: APK bauen
        run: gradle :app:assembleRelease --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk smart-receptionist.apk

      - name: Als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: smart-receptionist-apk
          path: android/smart-receptionist.apk

      # Fester Download-Link (auch für den Browser auf dem Roboter):
      # https://github.com/<user>/<repo>/releases/download/latest/smart-receptionist.apk
      - name: Release "latest" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest smart-receptionist.apk --title "Smart Receptionist (neuester Build)" --notes "Automatisch gebaut aus ${GITHUB_SHA::7}"
