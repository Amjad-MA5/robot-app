# Baut die APK auf GitHub-Servern (kostenlos) und stellt sie als Download bereit.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Unit-Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: APK bauen
        run: gradle :app:assembleRelease --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk smart-receptionist.apk

      - name: Als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: smart-receptionist-apk
          path: android/smart-receptionist.apk

      - name: Release "latest" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest smart-receptionist.apk --title "Smart Receptionist (neuester Build)" --notes "Automatisch gebaut aus ${GITHUB_SHA::7}"
